specVersion: 0.0.4
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: UniswapV2Pair
    network: base
    source:
      address: "0x493AD7E1c509dE7c89e1963fe9005EaD49FdD19c"
      abi: UniswapV2Pair
      startBlock: 18697674
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Sync
        - Transfer
      abis:
        - name: UniswapV2Pair
          file: ./abis/UniswapV2Pair.json
      eventHandlers:
        - event: Sync(uint112,uint112)
          handler: handleSync
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/handler.ts
  - kind: ethereum
    name: AerodromePair
    network: base
    source:
      address: "0xc02Dc3a9b6eaD739C56CDEa716D8fEC4Ffe4C799"
      abi: AerodromePair
      startBlock: 17736464
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Sync
        - Transfer
      abis:
        - name: AerodromePair
          file: ./abis/AerodromePair.json
      eventHandlers:
        - event: Sync(uint256,uint256)
          handler: handleSync2
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer2
      file: ./src/handler.ts
  - kind: ethereum
    name: AerodromeGauge
    network: base
    source:
      address: "0xea2c1c05c17eed888d0027f17ee23637dff66feb"
      abi: AerodromeGauge
      startBlock: 18093199
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Transfer
      abis:
        - name: AerodromeGauge
          file: ./abis/AerodromeGauge.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,uint256)
          handler: handleWithdraw
      file: ./src/handler.ts
  - kind: ethereum
    name: AerodromeCLGauge
    network: base
    source:
      address: "0xe6813b3271803dc1c083ec5e605d68926757ca92"
      abi: AerodromeCLGauge
      startBlock: 23874894
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Transfer
      abis:
        - name: AerodromeCLGauge
          file: ./abis/AerodromeCLGauge.json
      eventHandlers:
        - event: Deposit(indexed address,indexed uint256,indexed uint128)
          handler: handleCLDeposit
        - event: Withdraw(indexed address,indexed uint256,indexed uint128)
          handler: handleCLWithdraw
      file: ./src/handler.ts
  - kind: ethereum
    name: AerodromeCLPool
    network: base
    source:
      address: "0x8a86610952343beff5f1a906fd5bd9185c031a90"
      abi: AerodromeCLPool
      startBlock: 23651809
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Transfer
      abis:
        - name: AerodromeCLPool
          file: ./abis/AerodromeCLPool.json
      eventHandlers:
        - event: Mint(address,indexed address,indexed int24,indexed int24,uint128,uint256,uint256)
          handler: handleMint
        - event: Swap(indexed address,indexed address,int256,int256,uint160,uint128,int24)
          handler: handleSwap
        - event: Burn(indexed address,indexed int24,indexed int24,uint128,uint256,uint256)
          handler: handleBurn
        - event: CollectFees(indexed address,uint128,uint128)
          handler: handleCollectFees
      callHandlers:
        - function: setGaugeAndPositionManager(address,address)
          handler: handleSetGaugeAndPositionManager
      file: ./src/handler.ts
templates:
  - name: NonfungiblePositionManager
    kind: ethereum/contract
    network: base
    source:
      abi: NonfungiblePositionManager
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/nft-manager.ts
      entities:
        - NonfungiblePositionManager
      abis:
        - name: NonfungiblePositionManager
          file: ./abis/NonfungiblePositionManager.json
      eventHandlers:
        - event: DecreaseLiquidity(indexed uint256,uint128,uint256,uint256)
          handler: handleDecreaseLiquidity
        - event: IncreaseLiquidity(indexed uint256,uint128,uint256,uint256)
          handler: handleIncreaseLiquidity
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer3